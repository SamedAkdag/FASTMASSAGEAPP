name: Build and Publish KSP

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process"
  ORG_GRADLE_PROJECT_googleServicesMissingPassthrough: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: ${{ github.event_name != 'push' }}
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode Keystore
      if: github.event_name == 'push' && github.ref_type == 'tag'
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo $KEYSTORE_BASE64 | base64 -d > ${{ github.workspace }}/release-keystore.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/release-keystore.jks" >> $GITHUB_ENV
        else
          echo "No keystore provided, using debug signing"
        fi
        
    - name: Create .env file for secrets
      run: |
        cp .env.example .env
        if [ ! -z "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        fi
        
    - name: Clean and build with tests
      run: ./gradlew clean build --no-daemon --stacktrace
      
    - name: Run unit tests
      run: ./gradlew test --no-daemon
      
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        junit_files: '**/build/test-results/**/*.xml'
        check_name: 'Unit Test Results'
        fail_on_failure: false
        
    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon
      
    - name: Assemble Release APK (Signed if secrets available)
      if: github.event_name == 'push'
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ ! -z "$STORE_PASSWORD" ] && [ ! -z "$KEY_PASSWORD" ]; then
          export KEYSTORE_PATH=${KEYSTORE_PATH:-${{ github.workspace }}/release-keystore.jks}
          ./gradlew assembleRelease --no-daemon
        else
          echo "Signing secrets not available, building unsigned release"
          ./gradlew assembleRelease --no-daemon
        fi
        
    - name: Get version info
      id: version
      run: |
        VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
        VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Built version: $VERSION_NAME ($VERSION_CODE)"
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v${{ steps.version.outputs.version_name }}-${{ github.sha }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: github.event_name == 'push'
      with:
        name: app-release-v${{ steps.version.outputs.version_name }}-${{ github.sha }}
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: ignore
        
    - name: Upload Build Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports-${{ github.run_id }}
        path: |
          app/build/reports/
          build/reports/
          **/build/outputs/apk/*/output-metadata.json
        retention-days: 7
        if-no-files-found: ignore
        
    - name: Create GitHub Release (on tag)
      if: github.event_name == 'push' && github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        body: |
          ## 🚀 Release v${{ steps.version.outputs.version_name }}
          
          ### Changes
          - Automated build from commit ${{ github.sha }}
          - Version Code: ${{ steps.version.outputs.version_code }}
          
          ### Downloads
          - Debug APK: See attached files
          - Release APK: See attached files
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
