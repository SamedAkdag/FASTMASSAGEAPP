name: Build Signed APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/my-upload-key.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          echo "✅ Keystore decoded successfully"
        else
          echo "⚠️ No keystore secret found, build may fail for release"
        fi
        
    - name: Create .env file
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
        else
          touch .env
        fi
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "✅ GEMINI_API_KEY added to .env"
        fi
        
    - name: Build Release APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: upload
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "🔨 Starting build..."
        echo "KEYSTORE_PATH: $KEYSTORE_PATH"
        ./gradlew clean assembleRelease --no-daemon --stacktrace
        
    - name: Verify APK Output
      run: |
        echo "📦 Checking APK output..."
        ls -lh app/build/outputs/apk/release/ || echo "No APKs found"
        find app/build/outputs -name "*.apk" -type f
        
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
        if-no-files-found: warn
